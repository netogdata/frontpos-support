name: FrontPOS Support Windows

# FrontPOS Support (23. nov 2026): bygger kun Windows-udgaven (Flutter) med vores server/noegle (hbb_common-fork).
# Startes manuelt; filerne laegges som artefakter og paa udgivelsen "frontpos-windows-test".
on:
  workflow_dispatch:

# Info : Udgivelsen kraever skriveadgang; organisationens standard er kun laesning.
permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "frontpos-windows-test"
      only-windows: true
